[package]
name = "meshrmm-clipboard"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
[lints]
workspace = true
[dependencies]
anyhow.workspace = true
arboard.workspace = true
meshrmm-protocol.workspace = true
meshrmm-file-transfer = { path = "../file-transfer" }
[target.'cfg(target_os = "linux")'.dependencies]
# Wayland compositors with a data-control protocol; others through Xwayland.
arboard = { workspace = true, features = ["wayland-data-control"] }
# Windows and macOS set several formats in one update, encoding images as arboard does.
[target.'cfg(windows)'.dependencies]
clipboard-win = "5.4.1"
image = { version = "0.25.10", default-features = false, features = ["png"] }
[target.'cfg(target_os = "macos")'.dependencies]
image = { version = "0.25.10", default-features = false, features = ["tiff"] }
objc2 = "0.6.3"
objc2-app-kit = "0.3.2"
objc2-foundation = "0.3.2"
