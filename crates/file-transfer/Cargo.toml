[package]
name = "meshrmm-file-transfer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
[lints]
workspace = true
[dependencies]
tokio.workspace = true
anyhow.workspace = true
meshrmm-protocol.workspace = true
sha2.workspace = true
tracing.workspace = true
[target.'cfg(windows)'.dependencies]
windows-core = "0.62.2"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_Graphics_Gdi", "Win32_System_Com_StructuredStorage", "Win32_System_Com", "Win32_System_SystemServices", "Win32_System_Ole", "Win32_System_Memory", "Win32_System_DataExchange", "Win32_System_RemoteDesktop", "Win32_Security", "Win32_Storage_FileSystem", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse"] }
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.3"
objc2-app-kit = "0.3.2"
objc2-foundation = "0.3.2"
dispatch2 = "0.3.1"
libc = "0.2.189"
[target.'cfg(target_os = "linux")'.dependencies]
arboard.workspace = true
libc = "0.2.189"
wayland-client = "0.31.15"
wayland-protocols = { version = "0.32.13", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }
x11rb = { version = "0.13.2", features = ["xfixes"] }
zbus = "5"
