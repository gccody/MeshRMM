[workspace]
resolver = "3"
members = [
    "agent",
    "agent/protocol",
    "agent/windows/remote-screen",
    "crates/protocol-types",
    "crates/self-update",
    "crates/signaling-client",
    "remote",
    "server",
]
default-members = ["agent", "remote"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false

[workspace.dependencies]
anyhow = "1.0.104"
bytes = "1.12.1"
clap = { version = "4.6.6", features = ["derive", "env"] }
futures-util = { version = "0.3.34", features = ["sink"] }
pulsermm-protocol = { version = "0.1.0", path = "agent/protocol" }
pulsermm-protocol-types = { version = "0.1.0", path = "crates/protocol-types" }
pulsermm-self-update = { version = "0.1.0", path = "crates/self-update" }
pulsermm-signaling-client = { version = "0.1.0", path = "crates/signaling-client" }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
url = "2.5.8"
webrtc = "0.14.0"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[profile.server-release]
inherits = "release"
codegen-units = 1
lto = true
