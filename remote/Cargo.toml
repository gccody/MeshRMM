[package]
name = "meshrmm-remote"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "The native MeshRMM computer-remoting application"

[lints]
workspace = true

[dependencies]
meshrmm-audio = { path = "../crates/audio" }
meshrmm-session-transport = { path = "../crates/session-transport" }
meshrmm-file-transfer = { path = "../crates/file-transfer" }
meshrmm-chat = { path = "../crates/chat" }
anyhow.workspace = true
meshrmm-clipboard = { path = "../crates/clipboard" }
bytes.workspace = true
clap.workspace = true
futures-util.workspace = true
meshrmm-log-file.workspace = true
meshrmm-protocol.workspace = true
meshrmm-self-update.workspace = true
meshrmm-signaling-client.workspace = true
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true
webrtc.workspace = true

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Media_MediaFoundation", "Win32_Security", "Win32_System_Com", "Win32_System_Console", "Win32_System_LibraryLoader", "Win32_System_Performance", "Win32_System_Ole", "Win32_System_Registry", "Win32_System_Threading", "Win32_System_Variant", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2 = "0.6.3"
objc2-app-kit = "0.3.2"
objc2-av-foundation = { version = "0.3.2", features = ["objc2-core-media"] }
objc2-core-foundation = "0.3.2"
objc2-core-media = "0.3.2"
objc2-foundation = "0.3.2"
objc2-quartz-core = "0.3.2"
dispatch2 = "0.3.1"
libc = "0.2.189"

[dev-dependencies]
meshrmm-signaling-client = { workspace = true, features = ["test-support"] }
