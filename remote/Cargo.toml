[package]
name = "meshrmm-remote"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "The native MeshRMM computer-remoting application"

[lints]
workspace = true

[dependencies]
meshrmm-audio = { path = "../crates/audio" }
meshrmm-session-transport = { path = "../crates/session-transport" }
meshrmm-file-transfer = { path = "../crates/file-transfer" }
meshrmm-chat = { path = "../crates/chat" }
anyhow.workspace = true
meshrmm-clipboard = { path = "../crates/clipboard" }
bytes.workspace = true
clap.workspace = true
futures-util.workspace = true
meshrmm-log-file.workspace = true
meshrmm-protocol.workspace = true
meshrmm-self-update.workspace = true
meshrmm-signaling-client.workspace = true
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true
webrtc.workspace = true

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D_Fxc", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Media_MediaFoundation", "Win32_Security", "Win32_System_Com", "Win32_System_Console", "Win32_System_LibraryLoader", "Win32_System_Performance", "Win32_System_Ole", "Win32_System_Registry", "Win32_System_RemoteDesktop", "Win32_System_Threading", "Win32_System_Variant", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_UI_Controls", "Win32_Graphics_Gdi", "Win32_Graphics_GdiPlus"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2 = "0.6.3"
objc2-app-kit = "0.3.2"
objc2-av-foundation = { version = "0.3.2", features = ["objc2-core-media"] }
objc2-core-foundation = "0.3.2"
objc2-core-media = "0.3.2"
objc2-foundation = "0.3.2"
objc2-quartz-core = "0.3.2"
dispatch2 = "0.3.1"
libc = "0.2.189"

[target.'cfg(target_os = "linux")'.dependencies]
# The Linux viewer's window, drawing and controls. Every desktop library
# they use (X11, Wayland, Vulkan, EGL) is loaded at run time, so the viewer
# builds against glibc alone, like the Linux Agent.
egui = { version = "0.37.0", default-features = false, features = ["default_fonts"] }
egui-wgpu = { version = "0.37.0", default-features = false, features = ["wayland", "x11"] }
egui-winit = { version = "0.37.0", default-features = false, features = ["clipboard", "wayland", "x11"] }
libc = "0.2.189"
# Software H.264, built from the bundled OpenH264 source (BSD-2-Clause).
openh264 = "0.9.9"
wgpu = { version = "30.0.1", default-features = false, features = ["std", "parking_lot", "vulkan", "gles", "wgsl"] }
# The dialogs keep the desktop's title bars; GNOME on Wayland draws none, so
# winit draws them there.
winit = { version = "0.30.13", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen", "wayland-csd-adwaita"] }

[dev-dependencies]
meshrmm-session-transport = { path = "../crates/session-transport", features = ["test-support"] }
meshrmm-signaling-client = { workspace = true, features = ["test-support"] }
tokio = { workspace = true, features = ["test-util"] }
