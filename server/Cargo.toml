[package]
name = "meshrmm-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "The self-hosted MeshRMM server"

[lints]
workspace = true

[dependencies]
aes-gcm = "0.10.3"
anyhow.workspace = true
argon2 = "0.5.3"
async-trait = "0.1.92"
base64 = "0.22.1"
axum = { version = "0.8.9", features = ["ws"] }
axum-server = { version = "0.8.0", features = ["tls-rustls-no-provider"] }
bytes.workspace = true
chrono = { version = "0.4.42", default-features = false, features = ["std"] }
clap.workspace = true
figment = { version = "0.10.19", features = ["env", "toml"] }
futures-util.workspace = true
getrandom = "0.3"
hmac = "0.12.1"
http = "1.4.0"
httpdate = "1.0.3"
ipnet = { version = "2.12.2", features = ["serde"] }
lettre = { version = "0.11.23", default-features = false, features = ["builder", "ring", "rustls-native-certs", "smtp-transport", "tokio1-rustls"] }
meshrmm-protocol-types.workspace = true
meshrmm-self-update.workspace = true
openidconnect = { version = "4.0.1", default-features = false, features = ["accept-string-booleans"] }
# webauthn-rs verifies with OpenSSL; building it from source keeps the server
# free of a system OpenSSL, as the static Linux builds need.
openssl = { version = "0.10.75", features = ["vendored"] }
rust-embed = "8.13.0"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls"] }
rustls.workspace = true
rustls-acme = { version = "0.15.4", default-features = false, features = ["axum", "ring", "tls12", "webpki-roots"] }
sea-query = { version = "1.0.2", default-features = false, features = ["backend-postgres", "backend-sqlite", "derive"] }
sea-query-sqlx = { version = "0.9.1", features = ["sqlx-postgres", "sqlx-sqlite"] }
semver = "1.0.27"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx = { version = "0.9.0", default-features = false, features = ["derive", "macros", "migrate", "postgres", "runtime-tokio", "sqlite", "tls-rustls-ring-native-roots"] }
subtle = "2.6.1"
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-util"] }
tokio-util = { version = "0.7.19", features = ["io"] }
totp-rs = { version = "5", default-features = false, features = ["otpauth"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["compression-br", "compression-gzip", "fs", "limit", "set-header", "trace"] }
tracing.workspace = true
tracing-subscriber.workspace = true
turn = "0.11.0"
url = { workspace = true, features = ["serde"] }
uuid = { version = "1.24.1", features = ["v4", "v7"] }
webauthn-rs = { version = "0.5.5", features = ["conditional-ui"] }
webauthn-rs-proto = "0.5.5"
webrtc-util = { version = "0.12.0", default-features = false, features = ["conn"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
figment = { version = "0.10.19", features = ["env", "test", "toml"] }
http-body-util = "0.1"
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
tempfile = "3"
tokio-tungstenite.workspace = true
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
