[package]
name = "meshrmm-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "The MeshRMM server on Cloudflare Workers"

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
getrandom = { version = "0.2.17", features = ["js"] }
jsonwebtoken = { version = "11.0.0", default-features = false, features = ["rust_crypto"] }
meshrmm-protocol-types.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11.0"
subtle = "2.6.1"
uuid = { version = "1.24.1", features = ["v4", "js"] }
worker = { version = "0.8.5", features = ["d1", "http"] }
worker-macros = { version = "0.8.5", features = ["http"] }
