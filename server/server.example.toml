# MeshRMM server configuration. Copy to /etc/meshrmm/server.toml and edit.
#
# Every key can also be set with an environment variable: MESHRMM_ followed by
# the key path in capitals with __ between levels, for example
# MESHRMM_PUBLIC_URL, MESHRMM_TLS__MODE or MESHRMM_DATABASE__URL. Variables
# override this file. Check a configuration with `meshrmm-server check-config`.

# The address users, Agents and viewers reach this server at. Agents and
# viewers require HTTPS with TLS 1.3, so this must be an https:// URL.
public_url = "https://rmm.example.com"

# Holds the instance key, ACME certificates, uploaded files and (by default)
# the SQLite database. Back it up; the database's encrypted secrets cannot be
# read without the instance key stored here.
data_dir = "/var/lib/meshrmm"

[database]
# SQLite (the default, a file in data_dir) or PostgreSQL:
# url = "sqlite:///var/lib/meshrmm/meshrmm.db"
# url = "postgres://meshrmm:password@db.internal/meshrmm"
max_connections = 10

[http]
# Defaults to 0.0.0.0:443, or 127.0.0.1:8080 when tls.mode = "proxy".
# listen = "0.0.0.0:443"

# Choose one TLS mode.
[tls]
# Let's Encrypt: the server obtains and renews its certificate itself, using
# the TLS-ALPN-01 challenge on port 443. public_url's host must resolve to this
# server and port 443 must be reachable from the internet.
mode = "acme"
contact_email = "admin@example.com"
# domains = ["rmm.example.com"]                 # defaults to public_url's host
# directory_url = "https://acme-staging-v02.api.letsencrypt.org/directory"

# Your own certificate (for example from an internal CA, certbot, or a
# Cloudflare origin certificate behind Cloudflare's proxy). The files are
# reloaded when they change.
# mode = "files"
# cert_path = "/etc/meshrmm/fullchain.pem"
# key_path = "/etc/meshrmm/privkey.pem"

# Behind a reverse proxy that terminates TLS (Caddy, nginx, Traefik). The
# proxy must offer TLS 1.3, forward WebSocket upgrades, and set
# X-Forwarded-For. Only these peers' forwarding headers are believed.
# mode = "proxy"
# trusted_proxies = ["127.0.0.1/32", "::1/128"]

[downloads]
# The Agent and viewer builds shipped with this server release, and the
# artifacts.json that lists them. The server serves them and their update
# manifest at /downloads/; Agents and viewers update from it.
dir = "/usr/share/meshrmm/downloads"

[toolbox]
# The largest file users may upload to the toolbox library, in bytes. Keep it
# under any request body limit of a proxy in front of the server (Cloudflare's
# proxy allows 100 MB on its free plan).
max_file_bytes = 99614720

[remote]
# A remote session ends this many seconds after its viewer was last heard
# from (60 to 3600). An open viewer checks in every 30 seconds, so this is how
# long a viewer that crashed or lost its network can take to resume.
idle_timeout_seconds = 900

[turn]
# The built-in STUN/TURN server. Remote sessions use it to get through NAT:
# when the viewer and the Agent can't reach each other directly, it relays
# their traffic. Agents and viewers use it over UDP and IPv4 only, so open
# turn.listen's port and the relay ports to UDP from the internet. TURN can't
# go through an HTTP reverse proxy or Cloudflare's proxy; with either in front
# of public_url, set host to a DNS-only name for this server.
enabled = true
# The name or IPv4 address peers reach the TURN server at. Defaults to
# public_url's host, which must then have an A record.
# host = "turn.example.com"
# The public IPv4 address relayed traffic comes from. Defaults to the address
# host resolves to at startup. Set it if the server is behind NAT and host
# resolves to a private address.
# public_ip = "203.0.113.5"
listen = "0.0.0.0:3478"
# Each peer that relays uses one port while its session lasts.
relay_port_min = 49160
relay_port_max = 49200
# Addresses relays may not send to or receive from, for example your internal
# network if no Agent runs there. Loopback, link-local, multicast and broadcast
# addresses, and listen's port on any address, are always refused.
# blocked_peers = ["10.0.0.0/8"]

[log]
# A tracing filter, e.g. "info" or "meshrmm_server=debug,info".
level = "info"
# "text" or "json".
format = "text"
