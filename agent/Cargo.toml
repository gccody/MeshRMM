[package]
name = "meshrmm-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "The native MeshRMM endpoint agent"

[lints]
workspace = true

[dependencies]
meshrmm-audio = { path = "../crates/audio" }
meshrmm-session-transport = { path = "../crates/session-transport" }
meshrmm-file-transfer = { path = "../crates/file-transfer" }
meshrmm-chat = { path = "../crates/chat" }
zeroize = "1.8"
anyhow.workspace = true
meshrmm-clipboard = { path = "../crates/clipboard" }
bytes.workspace = true
clap.workspace = true
futures-util.workspace = true
meshrmm-log-file.workspace = true
meshrmm-protocol.workspace = true
meshrmm-self-update.workspace = true
meshrmm-signaling-client.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true
webrtc.workspace = true

[target.'cfg(any(windows, target_os = "macos", target_os = "linux"))'.dependencies]
ureq = { version = "3.4.0", features = ["json", "platform-verifier"] }
uuid = { version = "1.24.1", features = ["v4"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target."cfg(windows)".dependencies]
meshrmm-remote-screen = { version = "0.2.0", path = "windows/remote-screen" }
windows-service = "0.8.1"
windows = { version = "0.62.2", features = [
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_Display",
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
    "Win32_System_LibraryLoader",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_ProcessStatus",
    "Win32_System_Services",
    "Win32_System_Shutdown",
    "Win32_System_ApplicationInstallationAndServicing",
    "Win32_System_Performance",
    "Win32_System_Diagnostics_Etw",
    "Win32_System_Time",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_NetworkManagement_NetManagement",
    "Win32_Networking_WinSock",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Console",
    "Win32_Storage_FileSystem",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Credentials",
    "Win32_Security_Cryptography",
    "Win32_UI_Accessibility",
    "Win32_Security_Authentication_Identity",
    "Win32_System_Registry",
    "Win32_System_Environment",
    "Win32_System_Pipes",
    "Win32_System_RemoteDesktop",
    "Win32_System_SystemInformation",
    "Win32_System_Time",
    "Win32_System_Power",
    "Win32_System_Threading",
    "Win32_System_UpdateAgent",
    "Win32_System_Variant",
    "Win32_System_StationsAndDesktops",
    "Win32_System_JobObjects",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Magnification",
    "Win32_UI_Shell",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
dispatch2 = "0.3.1"
libc = "0.2.189"
objc2 = "0.6.3"
objc2-app-kit = "0.3.2"
objc2-core-foundation = "0.3.2"
objc2-core-graphics = "0.3.2"
objc2-core-media = "0.3.2"
objc2-core-video = "0.3.2"
objc2-foundation = "0.3.2"
objc2-quartz-core = "0.3.2"
objc2-screen-capture-kit = "0.3.2"
objc2-video-toolbox = "0.3.2"
postcard = { version = "1.1.3", features = ["use-std"] }

[target.'cfg(target_os = "linux")'.dependencies]
arboard.workspace = true
jpeg-encoder = "0.7.1"
libc = "0.2.189"
libloading = "0.8"
# Software H.264, built from the bundled OpenH264 source (BSD-2-Clause).
openh264 = "0.9.9"
openh264-sys2 = "0.9.9"
postcard = { version = "1.1.3", features = ["use-std"] }
wayland-client = "0.31.15"
wayland-protocols = { version = "0.32.13", features = ["client", "unstable"] }
wayland-protocols-plasma = { version = "0.3.12", features = ["client"] }
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }
x11rb = { version = "0.13.2", features = ["randr", "screensaver", "shm", "xfixes", "xinput", "xtest"] }
zbus = "5"

[dev-dependencies]
meshrmm-signaling-client = { workspace = true, features = ["test-support"] }
