[package]
name = "meshrmm-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "The native MeshRMM endpoint agent"

[lints]
workspace = true

[dependencies]
meshrmm-audio = { path = "../crates/audio" }
meshrmm-session-transport = { path = "../crates/session-transport" }
meshrmm-file-transfer = { path = "../crates/file-transfer" }
meshrmm-chat = { path = "../crates/chat" }
anyhow.workspace = true
meshrmm-clipboard = { path = "../crates/clipboard" }
bytes.workspace = true
clap.workspace = true
futures-util.workspace = true
meshrmm-protocol.workspace = true
meshrmm-self-update.workspace = true
meshrmm-signaling-client.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true
webrtc.workspace = true

[target."cfg(windows)".dependencies]
uuid = { version = "1.24.1", features = ["v4"] }
meshrmm-remote-screen = { version = "0.2.0", path = "windows/remote-screen" }
ureq = { version = "3.4.0", features = ["json", "platform-verifier"] }
windows-service = "0.8.1"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_ProcessStatus",
    "Win32_System_Services",
    "Win32_System_ApplicationInstallationAndServicing",
    "Win32_System_Performance",
    "Win32_System_Diagnostics_Etw",
    "Win32_System_Time",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_Storage_FileSystem",
    "Win32_Security",
    "Win32_Security_Authentication_Identity",
    "Win32_System_Registry",
    "Win32_System_Environment",
    "Win32_System_Pipes",
    "Win32_System_RemoteDesktop",
    "Win32_System_SystemInformation",
    "Win32_System_Power",
    "Win32_System_Threading",
    "Win32_System_StationsAndDesktops",
    "Win32_System_JobObjects",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Magnification",
    "Win32_UI_Shell",
    "Win32_UI_Controls",
    "Win32_UI_WindowsAndMessaging",
] }
