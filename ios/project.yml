name: MeshRMM
options:
  bundleIdPrefix: com.meshrmm
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    GENERATE_INFOPLIST_FILE: false
targets:
  MeshRMM:
    type: application
    platform: iOS
    sources:
      - path: MeshRMM
    dependencies:
      - framework: Vendor/WebRTC.xcframework
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.meshrmm.ios
        PRODUCT_NAME: MeshRMM
        INFOPLIST_FILE: MeshRMM/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
    scheme:
      testTargets:
        - MeshRMMTests
  MeshRMMTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MeshRMMTests
    dependencies:
      - target: MeshRMM
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.meshrmm.ios.tests
        GENERATE_INFOPLIST_FILE: true
