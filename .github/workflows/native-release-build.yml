name: Native release build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --release -p meshrmm-agent -p meshrmm-remote
      - uses: actions/upload-artifact@v4
        with:
          name: meshrmm-windows-x64
          path: |
            target/release/meshrmm-agent.exe
            target/release/meshrmm-remote.exe
          if-no-files-found: error
          retention-days: 7
