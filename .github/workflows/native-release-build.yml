name: Publish native release

on:
  push:
    branches: [main]
    paths: [release.json]
  workflow_dispatch:

concurrency:
  group: native-release-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
    # A called workflow's jobs can't have more permissions than the caller
    # grants, even jobs that are skipped, and CI's `changes` job reads pull
    # requests.
    permissions:
      contents: read
      pull-requests: read

  validate:
    name: Validate release version
    # Manual runs can target any branch; only main may publish.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - id: release
        name: Read release configuration
        shell: bash
        run: |
          node --test scripts/release-config.test.mjs
          version=$(node scripts/release-config.mjs version)
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Require an increased version
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        env:
          PREVIOUS_COMMIT: ${{ github.event.before }}
        shell: bash
        run: |
          if git show "$PREVIOUS_COMMIT:release.json" > "$RUNNER_TEMP/previous-release.json"; then
            node scripts/release-config.mjs assert-newer "$RUNNER_TEMP/previous-release.json"
          else
            echo "::error::Could not read previous release configuration; refusing to skip validation."
            exit 1
          fi
      - name: Require a version no older than the published release
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          origin=$(node scripts/release-config.mjs download-origin)
          if ! curl --fail --silent --show-error --location --retry 3 \
            "$origin/downloads/update-manifest.json" -o "$RUNNER_TEMP/published-manifest.json"; then
            echo "::error::Could not read the published update manifest; refusing to republish."
            exit 1
          fi
          node scripts/release-config.mjs assert-not-older "$RUNNER_TEMP/published-manifest.json"

  windows:
    name: Build Windows Agent and viewer
    needs: validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
      - name: Restore Windows Rust build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: native-windows-x64
          workspaces: ". -> target"
          cache-targets: true
          cache-workspace-crates: true
          cache-on-failure: true
      - name: Build release binaries
        shell: pwsh
        run: |
          & .\scripts\build-agent.ps1
          & .\scripts\build-remote.ps1
      - name: Collect release artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release-output -Force | Out-Null
          Copy-Item dashboard\public\downloads\*.exe release-output\
          Copy-Item dashboard\public\downloads\*.sha256 release-output\
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-windows-${{ needs.validate.outputs.version }}
          path: release-output/
          if-no-files-found: error
          retention-days: 14

  macos:
    name: Build macOS viewer (Apple Silicon) and universal Agent
    needs: validate
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
      - name: Restore Apple Silicon Rust build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: native-macos-arm64
          workspaces: ". -> target"
          cache-targets: true
          cache-workspace-crates: true
          cache-on-failure: true
      - name: Configure Developer ID signing
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
        shell: bash
        run: |
          # Installed Agents accept only updates signed by their own team, so
          # a release must never fall back to an ad-hoc signature.
          if [ -z "$CERTIFICATE_P12_BASE64" ] || [ -z "$CERTIFICATE_PASSWORD" ] || [ -z "$CODESIGN_IDENTITY" ]; then
            echo "::error::Configure the macOS Developer ID certificate, its password, and the signing identity secrets."
            exit 1
          fi
          certificate_path="$RUNNER_TEMP/meshrmm-release.p12"
          keychain_path="$RUNNER_TEMP/meshrmm-signing.keychain-db"
          keychain_password=$(openssl rand -base64 24)
          printf '%s' "$CERTIFICATE_P12_BASE64" | openssl base64 -d -A > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain_path"
          security list-keychain -d user -s "$keychain_path"
          echo "MESHRMM_CODESIGN_IDENTITY=$CODESIGN_IDENTITY" >> "$GITHUB_ENV"
      - name: Add the Intel macOS target for the universal Agent
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Build signed viewer archive
        shell: bash
        run: sh scripts/build-remote-macos.sh
      - name: Build signed universal Agent archive
        shell: bash
        run: sh scripts/build-agent-macos.sh
      - name: Notarize and staple the viewer and Agent
        env:
          NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
        shell: bash
        run: |
          if [ -z "$NOTARY_APPLE_ID" ] || [ -z "$NOTARY_TEAM_ID" ] || [ -z "$NOTARY_PASSWORD" ]; then
            echo "::error::Configure all three macOS notarization secrets."
            exit 1
          fi
          for pair in "dashboard/public/downloads/meshrmm-remote-macos-arm64.zip=dist/remote-macos/MeshRMM Remote.app" "dashboard/public/downloads/meshrmm-agent-macos.zip=dist/agent-macos/MeshRMM Agent.app"; do
            archive=${pair%%=*}
            app_directory=${pair#*=}
            xcrun notarytool submit "$archive" \
              --apple-id "$NOTARY_APPLE_ID" \
              --team-id "$NOTARY_TEAM_ID" \
              --password "$NOTARY_PASSWORD" \
              --wait
            xcrun stapler staple "$app_directory"
            rm -f -- "$archive"
            ditto -c -k --sequesterRsrc --keepParent "$app_directory" "$archive"
          done
      - name: Collect release artifacts
        shell: bash
        run: |
          mkdir -p release-output
          cp dashboard/public/downloads/meshrmm-remote-macos-arm64.zip dashboard/public/downloads/meshrmm-agent-macos.zip release-output/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-macos-arm64-${{ needs.validate.outputs.version }}
          path: release-output/
          if-no-files-found: error
          retention-days: 14

  deploy:
    name: Publish downloads to Cloudflare
    needs: [checks, validate, windows, macos]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_ACCOUNT_ID: "023f5fc9ffca88a15dac8e9f27b8d21f"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: native-windows-${{ needs.validate.outputs.version }}
          path: dashboard/public/downloads
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: native-macos-arm64-${{ needs.validate.outputs.version }}
          path: dashboard/public/downloads
      - name: Generate the release manifest
        shell: bash
        run: |
          version=$(node scripts/release-config.mjs version)
          origin=$(node scripts/release-config.mjs download-origin)
          manifest=dashboard/public/downloads/update-manifest.json
          rm -f -- "$manifest"
          node scripts/update-release-manifest.mjs "$manifest" agent-windows-x64 "$version" "$origin/downloads/meshrmm-agent-windows-x64.exe" dashboard/public/downloads/meshrmm-agent-windows-x64.exe
          node scripts/update-release-manifest.mjs "$manifest" client-windows-x64 "$version" "$origin/downloads/meshrmm-remote-windows-x64.exe" dashboard/public/downloads/meshrmm-remote-windows-x64.exe
          node scripts/update-release-manifest.mjs "$manifest" client-macos-arm64 "$version" "$origin/downloads/meshrmm-remote-macos-arm64.zip" dashboard/public/downloads/meshrmm-remote-macos-arm64.zip
          node scripts/update-release-manifest.mjs "$manifest" agent-macos "$version" "$origin/downloads/meshrmm-agent-macos.zip" dashboard/public/downloads/meshrmm-agent-macos.zip
          node scripts/verify-release-assets.mjs "$manifest"
      - name: Upload assembled release for recovery
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-release-${{ needs.validate.outputs.version }}
          path: dashboard/public/downloads/
          if-no-files-found: error
          retention-days: 30
      - name: Install dashboard dependencies
        working-directory: dashboard
        run: npm ci
      - name: Verify Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN to the production GitHub environment or repository secrets."
            exit 1
          fi
      - name: Build and deploy dashboard with native downloads
        working-directory: dashboard
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Allows `npm run deploy`, which re-verifies the assembled downloads first.
          MESHRMM_RELEASE_DEPLOY: "1"
        run: npm run deploy
