name: Publish release

# Builds a server release: the Agent and viewer for Windows and macOS, signed
# with the release key, inside a server tarball per Linux architecture and a
# multi-architecture Docker image. On main it publishes them as a GitHub
# release and to GHCR; a manual run on another branch builds and tests
# everything without signing or publishing.
on:
  push:
    branches: [main]
    paths: [release.json]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
    # A called workflow's jobs can't have more permissions than the caller
    # grants, even jobs that are skipped, and CI's `changes` job reads pull
    # requests.
    permissions:
      contents: read
      pull-requests: read

  validate:
    name: Validate release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      publish: ${{ steps.release.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - id: release
        name: Read release configuration
        shell: bash
        run: |
          node --test scripts/release-config.test.mjs scripts/release-artifacts.test.mjs
          version=$(node scripts/release-config.mjs version)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publish=${{ github.ref == 'refs/heads/main' }}" >> "$GITHUB_OUTPUT"
      - name: Require an increased version
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        env:
          PREVIOUS_COMMIT: ${{ github.event.before }}
        shell: bash
        run: |
          if git show "$PREVIOUS_COMMIT:release.json" > "$RUNNER_TEMP/previous-release.json"; then
            node scripts/release-config.mjs assert-newer "$RUNNER_TEMP/previous-release.json"
          else
            echo "::error::Could not read previous release configuration; refusing to skip validation."
            exit 1
          fi
      - name: Require an unpublished version no older than the latest release
        if: steps.release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          if gh release view "v$VERSION" --json tagName >/dev/null 2>&1; then
            echo "::error::Release v$VERSION is already published; increase the version in release.json."
            exit 1
          fi
          if latest=$(gh release view --json tagName --jq .tagName 2>/dev/null); then
            node scripts/release-config.mjs assert-not-older "$latest"
          else
            echo "No published release yet."
          fi

  windows:
    name: Build Windows Agent and viewer
    needs: validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
      - name: Restore Windows Rust build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: native-windows-x64
          workspaces: ". -> target"
          cache-targets: true
          cache-workspace-crates: true
          cache-on-failure: true
      - name: Build release binaries
        shell: pwsh
        run: |
          & .\scripts\build-agent.ps1
          & .\scripts\build-remote.ps1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-windows-${{ needs.validate.outputs.version }}
          path: dist/downloads/*.exe
          if-no-files-found: error
          retention-days: 14

  macos:
    name: Build macOS viewer (Apple Silicon) and universal Agent
    needs: validate
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
      - name: Restore Apple Silicon Rust build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: native-macos-arm64
          workspaces: ". -> target"
          cache-targets: true
          cache-workspace-crates: true
          cache-on-failure: true
      - name: Configure Developer ID signing
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
        shell: bash
        run: |
          # Installed Agents accept only updates signed by their own team, so
          # a release must never fall back to an ad-hoc signature.
          if [ -z "$CERTIFICATE_P12_BASE64" ] || [ -z "$CERTIFICATE_PASSWORD" ] || [ -z "$CODESIGN_IDENTITY" ]; then
            echo "::error::Configure the macOS Developer ID certificate, its password, and the signing identity secrets."
            exit 1
          fi
          certificate_path="$RUNNER_TEMP/meshrmm-release.p12"
          keychain_path="$RUNNER_TEMP/meshrmm-signing.keychain-db"
          keychain_password=$(openssl rand -base64 24)
          printf '%s' "$CERTIFICATE_P12_BASE64" | openssl base64 -d -A > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain_path"
          security list-keychain -d user -s "$keychain_path"
          echo "MESHRMM_CODESIGN_IDENTITY=$CODESIGN_IDENTITY" >> "$GITHUB_ENV"
      - name: Add the Intel macOS target for the universal Agent
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Build signed viewer archive
        shell: bash
        run: sh scripts/build-remote-macos.sh
      - name: Build signed universal Agent archive
        shell: bash
        run: sh scripts/build-agent-macos.sh
      - name: Notarize and staple the viewer and Agent
        env:
          NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
        shell: bash
        run: |
          if [ -z "$NOTARY_APPLE_ID" ] || [ -z "$NOTARY_TEAM_ID" ] || [ -z "$NOTARY_PASSWORD" ]; then
            echo "::error::Configure all three macOS notarization secrets."
            exit 1
          fi
          for pair in "dist/downloads/meshrmm-remote-macos-arm64.zip=dist/remote-macos/MeshRMM Remote.app" "dist/downloads/meshrmm-agent-macos.zip=dist/agent-macos/MeshRMM Agent.app"; do
            archive=${pair%%=*}
            app_directory=${pair#*=}
            xcrun notarytool submit "$archive" \
              --apple-id "$NOTARY_APPLE_ID" \
              --team-id "$NOTARY_TEAM_ID" \
              --password "$NOTARY_PASSWORD" \
              --wait
            xcrun stapler staple "$app_directory"
            rm -f -- "$archive"
            ditto -c -k --sequesterRsrc --keepParent "$app_directory" "$archive"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-macos-arm64-${{ needs.validate.outputs.version }}
          path: dist/downloads/*.zip
          if-no-files-found: error
          retention-days: 14

  server:
    name: Build the ${{ matrix.arch }} Linux server
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Build the website
        working-directory: dashboard
        run: |
          npm ci
          npm run build
      - name: Install the musl cross-compiler
        run: |
          pip install --user ziglang==0.16.0 cargo-zigbuild==0.23.4
          rustup target add ${{ matrix.arch }}-unknown-linux-musl
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: server-${{ matrix.arch }}-musl
      - name: Build the static server with the website
        run: cargo zigbuild --locked --profile server-release -p meshrmm-server --target ${{ matrix.arch }}-unknown-linux-musl
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: server-${{ matrix.arch }}-${{ needs.validate.outputs.version }}
          path: target/${{ matrix.arch }}-unknown-linux-musl/server-release/meshrmm-server
          if-no-files-found: error
          retention-days: 14

  sign:
    name: Sign the Agent and viewer builds
    needs: [validate, windows, macos]
    if: needs.validate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: native-*-${{ needs.validate.outputs.version }}
          merge-multiple: true
          path: downloads
      - name: Sign every build with the release key
        env:
          MESHRMM_RELEASE_SIGNING_KEY: ${{ secrets.MESHRMM_RELEASE_SIGNING_KEY }}
        shell: bash
        run: |
          if [ -z "$MESHRMM_RELEASE_SIGNING_KEY" ]; then
            echo "::error::Add MESHRMM_RELEASE_SIGNING_KEY to the production environment."
            exit 1
          fi
          node scripts/release-artifacts.mjs write downloads
          node scripts/release-artifacts.mjs verify downloads
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: artifacts-json-${{ needs.validate.outputs.version }}
          path: downloads/artifacts.json
          if-no-files-found: error
          retention-days: 14

  package:
    name: Package and test the server release
    needs: [validate, windows, macos, server, sign]
    # `sign` is skipped outside main.
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: native-*-${{ needs.validate.outputs.version }}
          merge-multiple: true
          path: downloads
      - if: needs.validate.outputs.publish == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: artifacts-json-${{ needs.validate.outputs.version }}
          path: downloads
      - name: Describe the builds
        shell: bash
        run: |
          if [ "${{ needs.validate.outputs.publish }}" = true ]; then
            node scripts/release-artifacts.mjs verify downloads
          else
            node scripts/release-artifacts.mjs write downloads
            node scripts/release-artifacts.mjs verify downloads --allow-unsigned
          fi
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: server-*-${{ needs.validate.outputs.version }}
          path: servers
      - name: Pack the tarballs
        shell: bash
        run: |
          for arch in x86_64 aarch64; do
            sh scripts/package-server.sh "$arch" "servers/server-$arch-$VERSION/meshrmm-server" downloads dist/release
          done
          (cd dist/release && sha256sum -- *.tar.gz > SHA256SUMS)
          cat dist/release/SHA256SUMS
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Test the tarball and Docker image
        run: sudo sh scripts/test-server-package.sh dist/release
      - name: Build the image for every architecture
        run: docker buildx build --platform linux/amd64,linux/arm64 -f packaging/Dockerfile dist/release/image
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ needs.validate.outputs.version }}
          path: |
            dist/release/*.tar.gz
            dist/release/SHA256SUMS
            dist/release/image/
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish to GitHub Releases and GHCR
    needs: [checks, validate, package]
    if: needs.validate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-${{ needs.validate.outputs.version }}
          path: dist/release
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Push the Docker image
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}-server"
          docker buildx build --platform linux/amd64,linux/arm64 -f packaging/Dockerfile \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.version=$VERSION" \
            --tag "$image:$VERSION" --tag "$image:latest" --push dist/release/image
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "MeshRMM $VERSION" \
            --notes "Server tarballs for x86_64 and arm64 Linux, each with the Windows and macOS Agent and viewer. The Docker image is ghcr.io/${GITHUB_REPOSITORY,,}-server:$VERSION." \
            dist/release/*.tar.gz dist/release/SHA256SUMS
