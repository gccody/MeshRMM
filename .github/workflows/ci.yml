name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      run-all:
        description: Run every job regardless of which paths changed.
        type: boolean
        default: true

permissions:
  contents: read

# A newer push to the same ref supersedes the run in progress. The group names
# the workflow because a reusable call runs under its caller's name: the
# release workflow's checks must not share, and be cancelled with, the
# push-triggered CI run for the same commit on main.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Each job runs only when a path it depends on changed. Required checks count a
# skipped job as passing, so filtering here, rather than with workflow-level
# `paths`, keeps pull requests mergeable. If `changes` fails or is skipped (as
# in reusable calls, which must check everything), every job runs.
jobs:
  changes:
    if: ${{ !inputs.run-all }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      remote: ${{ steps.filter.outputs.remote }}
      server: ${{ steps.filter.outputs.server }}
      dashboard: ${{ steps.filter.outputs.dashboard }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          # `!(*.md)` leaves out Markdown files, which no check reads.
          filters: |
            workflow: &workflow
              - '.github/workflows/ci.yml'
            cargo: &cargo
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'vendor/**/!(*.md)'
            rust:
              - *workflow
              - *cargo
              - 'agent/**/!(*.md)'
              - 'crates/**/!(*.md)'
              - 'remote/**/!(*.md)'
              - 'server/**/!(*.md)'
            remote:
              - *workflow
              - *cargo
              - 'agent/**/!(*.md)'
              - 'crates/**/!(*.md)'
              - 'remote/**/!(*.md)'
            server:
              - *workflow
              - *cargo
              - 'crates/**/!(*.md)'
              - 'server/**/!(*.md)'
              - 'scripts/**/!(*.md)'
              - 'release.json'
            dashboard:
              - *workflow
              - 'dashboard/**/!(*.md)'
              - 'scripts/verify-release-assets.mjs'

  rust-windows:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.rust == 'true') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all -- --check
      # The server runs on Linux only; the server job checks it.
      - run: cargo clippy --locked --workspace --exclude meshrmm-server --all-targets -- -D warnings
      - run: cargo test --locked --workspace --exclude meshrmm-server

  remote-macos:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.remote == 'true') }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo clippy --locked -p meshrmm-remote -p meshrmm-agent -p meshrmm-session-transport --all-targets -- -D warnings
      - run: cargo test --locked -p meshrmm-remote -p meshrmm-agent -p meshrmm-session-transport

  server:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.server == 'true') }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The server's database tests run on SQLite and on this PostgreSQL.
      MESHRMM_TEST_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo clippy --locked -p meshrmm-server --all-targets -- -D warnings
      - run: cargo test --locked -p meshrmm-server
      - run: python3 -m unittest discover -s scripts/tests -v
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: node --test scripts/*.test.mjs

  dashboard:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.dashboard == 'true') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run verify
