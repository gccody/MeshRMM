name: CI

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  rust-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  remote-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p meshrmm-remote -p meshrmm-session-transport --all-targets -- -D warnings
      - run: cargo test -p meshrmm-remote -p meshrmm-session-transport

  server-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p meshrmm-server --target wasm32-unknown-unknown
      - run: cargo test -p meshrmm-server
      - run: python3 server/tests/sql_regressions.py
      - run: python3 -m unittest discover -s scripts/tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
        working-directory: dashboard
      - run: cargo install worker-build --version 0.8.5 --locked
      - run: worker-build --profile server-release
        working-directory: server
      - run: node server/tests/presence.mjs
      - run: node server/tests/session_cleanup.mjs

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run verify
